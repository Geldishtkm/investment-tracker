server.port=${PORT:8080}

# Load local secrets from a .env file in the working directory, if present.
# Real environment variables take precedence. See .env.example.
spring.config.import=optional:file:.env[.properties]

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/myproject}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# JWT Security
# Required, at least 32 characters (HS256). Generate with: openssl rand -base64 48
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
# Refresh tokens renew the short-lived access token above without a new login. Each use extends
# the session, so users stay signed in unless they are away for longer than this
auth.refresh-token.ttl-days=${REFRESH_TOKEN_TTL_DAYS:7}
auth.refresh-token.cleanup-cron=${REFRESH_TOKEN_CLEANUP_CRON:0 30 * * * *}

# Email (SMTP) for signup verification codes. Leave MAIL_HOST unset locally and the code is
# written to the server log instead of being emailed. Gmail: smtp.gmail.com, port 587, and an
# App Password (Google Account > Security > App passwords), not your normal password.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@localhost}}

# Signup verification codes
app.verification.code-ttl-minutes=${VERIFICATION_CODE_TTL_MINUTES:10}
app.verification.resend-cooldown-seconds=${VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
app.verification.max-attempts=${VERIFICATION_MAX_ATTEMPTS:5}
# Delete unverified signups whose code expired (default: at the top of every hour)
app.verification.cleanup-cron=${VERIFICATION_CLEANUP_CRON:0 0 * * * *}

# Portfolio analytics model inputs
# Daily history window and minimum sample size for return, volatility and covariance estimates
portfolio.analytics.lookback-days=${ANALYTICS_LOOKBACK_DAYS:365}
portfolio.analytics.min-observations=${ANALYTICS_MIN_OBSERVATIONS:60}
# Crypto trades 365 days a year; use 252 if the portfolio holds exchange-traded assets
portfolio.analytics.periods-per-year=${ANALYTICS_PERIODS_PER_YEAR:365}
# Annual risk-free rate (e.g. the current 3-month US Treasury bill yield). Keep it current.
portfolio.analytics.risk-free-rate=${RISK_FREE_RATE:0.04}
portfolio.analytics.benchmark-coin-id=${BENCHMARK_COIN_ID:bitcoin}
# Price history is reused for this long before CoinGecko is asked again; older data is still
# served (from memory or the database) when CoinGecko is rate limiting or unreachable
portfolio.analytics.price-cache-ttl-minutes=${PRICE_CACHE_TTL_MINUTES:30}

# CoinGecko. A free Demo API key (coingecko.com/en/api/pricing) raises the rate limit; optional.
coingecko.api-key=${COINGECKO_API_KEY:}
# How long to stop calling CoinGecko after a 429 when it sends no Retry-After header
coingecko.rate-limit-cooldown-seconds=${COINGECKO_RATE_LIMIT_COOLDOWN_SECONDS:60}
# Spot prices are reused for this long, so page refreshes don't each trigger a CoinGecko call
coingecko.spot-price-ttl-seconds=${COINGECKO_SPOT_PRICE_TTL_SECONDS:60}
portfolio.var.monte-carlo-simulations=${VAR_MONTE_CARLO_SIMULATIONS:20000}
# Black-Litterman market risk aversion (delta). 2.5 is the world-market value used by
# He & Litterman (1999) and Idzorek (2004); set from your own market view if you have one.
portfolio.black-litterman.risk-aversion=${BL_RISK_AVERSION:2.5}
# Exchange fee plus spread charged per trade, as a fraction of the traded value
portfolio.rebalancing.transaction-cost-rate=${REBALANCING_TRANSACTION_COST_RATE:0.001}
portfolio.rebalancing.min-trade-weight=${REBALANCING_MIN_TRADE_WEIGHT:0.01}

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.enable-deep-linking=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.csrf.use_bom=true

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=Initial baseline
spring.flyway.ignore-migration-patterns=*:missing
spring.flyway.out-of-order=true 