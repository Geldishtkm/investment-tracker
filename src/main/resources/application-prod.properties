# ==== PRODUCTION CONFIGURATION FOR RAILWAY ====
# This file contains production-specific settings for Railway deployment

# ==== Server Configuration ====
server.port=${PORT:8080}

# ==== TEMPORARILY DISABLE DATABASE ====
# Comment out database configuration to test startup
# spring.datasource.url=${DB_URL}
# spring.datasource.username=${DB_USERNAME}
# spring.datasource.password=${DB_PASSWORD}
# spring.datasource.driver-class-name=org.postgresql.Driver

# ==== JPA / Hibernate ====
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.hibernate.ddl-auto=create-drop
# spring.jpa.show-sql=false
# spring.jpa.properties.hibernate.format_sql=false

# ==== JWT Security ====
# Required: set JWT_SECRET in the Railway service variables (at least 32 characters)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# ==== Flyway Database Migrations ====
# Disable Flyway for now to prevent startup errors
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=false

# ==== Logging ====
# Completely disable all logging to prevent Railway rate limiting
logging.level.root=OFF
logging.level.com.portfolio.tracker=OFF
logging.level.org.springframework.web=OFF
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.springframework.boot=OFF
logging.level.org.springframework.security=OFF
logging.level.org.apache.tomcat=OFF
logging.level.org.apache.coyote=OFF
logging.level.org.apache.catalina=OFF

# ==== CORS Configuration ====
# Allow all origins for now (can restrict later)
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# ==== Health Check Endpoint ====
# Simple health check for Railway
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
